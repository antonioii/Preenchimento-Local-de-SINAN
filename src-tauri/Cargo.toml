[package]
name = "sinan-local-tauri"
version = "0.1.0"
description = "Versao stand-alone Tauri do gerador local SINAN."
authors = ["CAPS"]
edition = "2021"

[lib]
name = "sinan_local_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
